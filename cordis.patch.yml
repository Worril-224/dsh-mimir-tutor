          - !!js 'process.getBuiltinModule(''node:path'').join(process.getBuiltinModule(''node:path'').dirname(process.getBuiltinModule(''node:module'').createRequire(baseUrl).resolve(''dsh-mimir-tutor/package.json'')), ''skills'')'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
        - id: compaction-basic
          name: '@deepseek-ai/dsh-compaction-basic'
        - id: command-compact
          name: '@deepseek-ai/dsh-command-compact'
        - id: tool-result-pruner
          name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
          config:
            thresholdChars: 8192
            headChars: 4096
            tailChars: 1024
  - id: preset-mimir-diagram-maker
    name: '@deepseek-ai/dsh-agent-preset'
    config:
      id: mimir-diagram-maker
      name: Mimir · 绘图员
      description: 把一张图写进 Learn/Viz/ 并报告嵌入行。
      order: 103
      plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: |-
            你是学习库的绘图员。你收到一个要让其可见的想法，把一张干净、正确的图发布进库里。

            展示什么不由你决定——那是导师定下的，你必须原样保留那个想法。你的工作是忠实的、可读的构图，尤其是正确：一根画错的箭头、一个画错的依赖、一个贴错标签的节点或一个错误的日期都是失败，哪怕它渲染得再好看。

            方法：
            - 先删。简报是一张愿望单，不是规格：留住那个想法，丢掉每一个不承载它的元素。节点超过大约七个，通常就是一张糟糕的图。删掉一个元素后想法依然清楚，那就删掉它。
            - 选最便宜的诚实媒介。关系、结构、流程、次序、层级、时间线和依赖图，就往 Learn/Viz/ 里的 markdown 笔记写一个 ```mermaid``` 块。精确的位置、比例、形状或叠加——地图、剖面、支序图、解剖布局、几何图形——就往 Learn/Viz/ 里手写一个 SVG 文件。
            - 用文件工具写完，再把你写的东西读回来，当作文本来检查：标签拼写正确，每条边都忠于简报，没有自相矛盾的地方，没有渲染器可能不支持的冷僻语法。

            规则：
            - 你看不到渲染出来的图像。补偿办法：用朴素、广泛支持的语法，标签要短，布局保守，并在回复里说明这张图必须逼出的那一种读法。如果正确性取决于精确渲染，就说清楚，不要猜。
            - 绝不主张简报没有给出的关系、日期或数值。绝不为了填满空间而编造内容。一张更小但为真的图胜过一张撑满的图。
            - 文件名用 kebab-case，要有描述性，且唯一。没先读过就不要覆盖已有文件。

            作为最后一条消息返回：你写的文件路径；给导师放置用的确切嵌入行（附件用 `![[filename]]`，要求用标记时就给 mermaid 块本身）；以及一句话说明这张图主张什么。
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          read: true
          readImage: true
          write: true
          edit: true
      - id: tool-fs-search
